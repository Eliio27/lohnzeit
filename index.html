<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lohnzeit">
<meta name="theme-color" content="#0E0D0B">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<title>Lohnzeit</title>
<style>
  :root{
    --bg:#0E0D0B; --surface:#1A1815; --line:#2E2A24;
    --text:#F2EDE3; --muted:#8A8175; --gold:#E9B44C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column;
    min-height:100vh; min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow:hidden;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 24px 0;
  }
  .brand{
    font-size:13px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--muted); font-weight:600;
  }
  .gear{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
    background:var(--surface); color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:18px;
    cursor:pointer;
  }
  .gear:active{background:#221f1a;}

  main{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    align-items:center; padding:0 28px; gap:6px;
  }

  /* amount input */
  .amount-wrap{
    display:flex; align-items:baseline; gap:10px;
    border-bottom:1px solid var(--line); padding:4px 0 10px;
  }
  .cur{color:var(--muted);font-size:26px;font-weight:600;}
  #amount{
    background:transparent;border:none;outline:none;color:var(--gold);
    font-size:64px;font-weight:600;width:min(6ch,60vw);text-align:center;
    caret-color:var(--gold);
  }
  #amount::placeholder{color:#4a453d;}
  .amount-hint{color:var(--muted);font-size:13px;margin-top:14px;letter-spacing:.02em;}

  /* result */
  .result{
    margin-top:40px; text-align:center;
    transition:opacity .18s ease, transform .18s ease;
  }
  .result.blink{opacity:.35;transform:translateY(2px);}
  .result-label{color:var(--muted);font-size:14px;letter-spacing:.03em;margin-bottom:12px;}
  .time{font-size:52px;font-weight:600;line-height:1;}
  .time .u{color:var(--muted);font-size:26px;font-weight:500;margin:0 2px 0 1px;}
  .rate{color:var(--muted);font-size:13px;margin-top:26px;}
  .rate b{color:var(--text);font-weight:600;}

  /* empty state */
  .empty{text-align:center;}
  .empty p{color:var(--muted);font-size:16px;margin-bottom:20px;line-height:1.5;}
  .btn{
    background:var(--gold);color:#1a1408;border:none;border-radius:14px;
    padding:14px 22px;font-size:16px;font-weight:600;cursor:pointer;
  }
  .btn:active{opacity:.85;}

  /* settings sheet */
  .sheet-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:5;
    backdrop-filter:blur(2px);
  }
  .sheet-bg.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    background:var(--surface);border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:8px 24px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .sheet.open{transform:translateY(0);}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 20px;}
  .sheet h2{font-size:20px;font-weight:600;margin-bottom:22px;}
  .field{margin-bottom:18px;}
  .field label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px;letter-spacing:.02em;}
  .field input{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:15px 16px;color:var(--text);font-size:20px;outline:none;
    font-family:ui-monospace,"SF Mono",Menlo,monospace;
  }
  .field input:focus{border-color:var(--gold);}
  .sheet-rate{
    color:var(--muted);font-size:14px;margin:4px 0 22px;
    display:flex;justify-content:space-between;align-items:center;
  }
  .sheet-rate b{color:var(--gold);font-weight:600;font-size:16px;}
  .sheet .btn{width:100%;padding:16px;font-size:17px;}

  /* update toast */
  .update{
    position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:4;
    transform:translate(-50%,calc(100% + 40px));transition:transform .28s cubic-bezier(.32,.72,0,1);
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    color:var(--text);font-size:14px;padding:12px 16px;white-space:nowrap;
    font-family:inherit;cursor:pointer;
  }
  .update.show{transform:translate(-50%,0);}
  .update b{color:var(--gold);font-weight:600;}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>
  <header>
    <div class="brand">Lohnzeit</div>
    <div class="gear" id="gear" aria-label="Einstellungen">&#9881;</div>
  </header>

  <main id="main">
    <!-- filled by JS -->
  </main>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet">
    <div class="grabber"></div>
    <h2>Einstellungen</h2>
    <div class="field">
      <label for="salary">Monatslohn netto (CHF)</label>
      <input id="salary" inputmode="decimal" placeholder="0.00">
    </div>
    <div class="field">
      <label for="hours">Vertragsstunden pro Woche</label>
      <input id="hours" inputmode="decimal" placeholder="0">
    </div>
    <div class="sheet-rate">
      <span>Dein Stundenlohn</span>
      <b id="sheetRate">&ndash;</b>
    </div>
    <button class="btn" id="save">Speichern</button>
  </div>

  <button class="update" id="update" type="button">Neue Version verf&uuml;gbar &ndash; <b>neu laden</b></button>

<script>
  var KEY = "lohnzeit.v1";
  var state = load();

  function load(){
    try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s) return s; }catch(e){}
    return { salary:null, hours:null, amount:"" };
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  function rate(){
    if(!state.salary || !state.hours) return null;
    var monthlyHours = state.hours * (52/12);
    if(monthlyHours <= 0) return null;
    return state.salary / monthlyHours;
  }

  function fmtCHF(v){
    return v.toLocaleString("de-CH",{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  function timeParts(amount){
    var r = rate();
    if(!r || !amount || amount<=0) return null;
    var decH = amount / r;
    var totalMin = Math.round(decH*60);
    var h = Math.floor(totalMin/60);
    var m = totalMin%60;
    return {h:h,m:m};
  }

  var main = document.getElementById("main");

  function render(){
    var r = rate();
    if(r===null){
      main.innerHTML =
        '<div class="empty">'+
        '<p>Trag zuerst deinen Monatslohn<br>und deine Stunden ein.</p>'+
        '<button class="btn" id="openSet">Einstellungen &ouml;ffnen</button>'+
        '</div>';
      document.getElementById("openSet").onclick = openSheet;
      return;
    }
    main.innerHTML =
      '<div class="amount-wrap">'+
        '<span class="cur">CHF</span>'+
        '<input id="amount" class="mono" inputmode="decimal" placeholder="0" value="'+(state.amount||"")+'">'+
      '</div>'+
      '<div class="amount-hint">Betrag eingeben</div>'+
      '<div class="result" id="result"></div>';

    var inp = document.getElementById("amount");
    inp.addEventListener("input", function(){
      state.amount = inp.value;
      save();
      updateResult(true);
    });
    updateResult(false);
    // autofocus only if empty
    if(!state.amount){ setTimeout(function(){ inp.focus(); }, 350); }
  }

  function updateResult(blink){
    var res = document.getElementById("result");
    if(!res) return;
    var raw = (state.amount||"").replace(",",".");
    var amount = parseFloat(raw);
    var r = rate();
    var t = timeParts(amount);

    var html;
    if(!t){
      html = '<div class="rate">Stundenlohn: <b>CHF '+fmtCHF(r)+'</b></div>';
    } else {
      html =
        '<div class="result-label">Daf&uuml;r arbeitest du</div>'+
        '<div class="time mono">'+t.h+'<span class="u">h</span> '+
          (t.m<10?"0":"")+t.m+'<span class="u">min</span></div>'+
        '<div class="rate">bei <b>CHF '+fmtCHF(r)+'</b> pro Stunde</div>';
    }
    res.innerHTML = html;
    if(blink){
      res.classList.add("blink");
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ res.classList.remove("blink"); });
      });
    }
  }

  /* settings sheet */
  var sheet = document.getElementById("sheet");
  var sheetBg = document.getElementById("sheetBg");
  var salaryInp = document.getElementById("salary");
  var hoursInp = document.getElementById("hours");
  var sheetRate = document.getElementById("sheetRate");

  function openSheet(){
    salaryInp.value = state.salary || "";
    hoursInp.value = state.hours || "";
    updateSheetRate();
    sheet.classList.add("open");
    sheetBg.classList.add("open");
  }
  function closeSheet(){
    sheet.classList.remove("open");
    sheetBg.classList.remove("open");
  }
  function updateSheetRate(){
    var s = parseFloat((salaryInp.value||"").replace(",","."));
    var h = parseFloat((hoursInp.value||"").replace(",","."));
    if(s>0 && h>0){
      var rt = s / (h*(52/12));
      sheetRate.textContent = "CHF "+fmtCHF(rt)+"/h";
    } else {
      sheetRate.innerHTML = "&ndash;";
    }
  }

  document.getElementById("gear").onclick = openSheet;
  sheetBg.onclick = closeSheet;
  salaryInp.addEventListener("input", updateSheetRate);
  hoursInp.addEventListener("input", updateSheetRate);

  document.getElementById("save").onclick = function(){
    var s = parseFloat((salaryInp.value||"").replace(",","."));
    var h = parseFloat((hoursInp.value||"").replace(",","."));
    state.salary = (s>0)? s : null;
    state.hours = (h>0)? h : null;
    save();
    closeSheet();
    render();
  };

  render();

  /* offline / PWA */
  if(navigator.storage && navigator.storage.persist){
    navigator.storage.persisted().then(function(p){ if(!p) navigator.storage.persist(); }).catch(function(){});
  }

  if("serviceWorker" in navigator){
    var updateBtn = document.getElementById("update");
    var waitingSW = null;
    var userAccepted = false;
    var reloading = false;

    function showUpdate(sw){ waitingSW = sw; updateBtn.classList.add("show"); }

    updateBtn.onclick = function(){
      userAccepted = true;
      if(waitingSW) waitingSW.postMessage("SKIP_WAITING");
      else location.reload();
    };

    navigator.serviceWorker.addEventListener("controllerchange", function(){
      // Beim allerersten Install (clients.claim) nicht neu laden, nur nach Tippen auf den Hinweis.
      if(!userAccepted || reloading) return;
      reloading = true;
      location.reload();
    });

    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").then(function(reg){
        if(reg.waiting && navigator.serviceWorker.controller) showUpdate(reg.waiting);
        reg.addEventListener("updatefound", function(){
          var nw = reg.installing;
          if(!nw) return;
          nw.addEventListener("statechange", function(){
            // Nur bei einem Update, nicht bei der allerersten Installation.
            if(nw.state === "installed" && navigator.serviceWorker.controller) showUpdate(nw);
          });
        });
        // Als installierte App bleibt die Seite lange offen: beim Zurückkehren nach Updates schauen.
        document.addEventListener("visibilitychange", function(){
          if(document.visibilityState === "visible") reg.update().catch(function(){});
        });
      }).catch(function(){});
    });
  }
</script>
</body>
</html>
